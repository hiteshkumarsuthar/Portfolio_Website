  <rect x="886" y="380" width="348" height="64" rx="8" fill="#1f2633"/>
  <circle cx="912" cy="412" r="10" fill="#10B981"/>
  <text x="907" y="416" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
  <text x="936" y="405" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Aadhaar &amp; Academic Records</text>
  <text x="936" y="425" fill="#9ca3af" font-family="sans-serif" font-size="11">Linked &amp; Verified</text>

  <rect x="886" y="458" width="348" height="64" rx="8" fill="#1f2633"/>
  <circle cx="912" cy="490" r="10" fill="#10B981"/>
  <text x="907" y="494" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">✓</text>
  <text x="936" y="483" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">AI / Tech Degree Specialization</text>
  <text x="936" y="503" fill="#9ca3af" font-family="sans-serif" font-size="11">Qualified for Scheme Bracket C</text>

