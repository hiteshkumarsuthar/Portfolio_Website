  <text x="886" y="200" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Scheme Profile Match</text>
  <text x="886" y="222" fill="#9ca3af" font-family="sans-serif" font-size="12">Real-time vector similarity score</text>

