  <circle cx="1060" cy="300" r="54" fill="none" stroke="#10B981" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="33.9" stroke-linecap="round"/>
  <text x="1035" y="306" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">94%</text>
  <text x="1038" y="324" fill="#9ca3af" font-family="sans-serif" font-size="11">Match</text>

